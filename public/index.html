<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dentalab · Licitaciones IA</title><link rel="stylesheet" href="/styles.css"></head><body><header>Dentalab · Licitaciones & Presupuestos IA</header><main><div id="status" class="status"></div><section class="grid"><article><h2>1. Catálogo</h2><p>Cargá una exportación XLSX/CSV con SKU y descripción.</p><input id="catalogFile" type="file" accept=".xlsx,.xls,.csv"><div class="actions"><button id="catalogBtn">Cargar catálogo</button><span id="catalogMsg"></span></div></article><article><h2>2. Nueva solicitud</h2><label>Cliente (opcional)</label><input id="client"><label>Archivos</label><input id="files" type="file" multiple accept=".pdf,.xlsx,.xls,.csv,.docx,.txt,.html,.htm,.png,.jpg,.jpeg,.webp"><label>Texto del mail (opcional)</label><textarea id="text" rows="4"></textarea><div class="actions"><button id="analyzeBtn" class="primary">Analizar solicitud</button><span id="analyzeMsg"></span></div></article></section><section id="result"></section><article class="history-card"><div class="title-row"><h2>Historial</h2><button id="refreshBtn">Actualizar</button></div><div id="history">Sin trabajos todavía.</div></article></main><div id="login" class="overlay hidden"><div class="loginbox"><h2>Acceso interno</h2><p>Ingresá la clave configurada en Render.</p><input id="key" type="password"><button id="loginBtn" class="primary full">Entrar</button><div id="loginErr" class="error"></div></div></div><script src="/app.js"></script></body></html>
