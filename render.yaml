services:
  - type: web
    name: dentalab-licitaciones-ia
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_ACCESS_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/dentalab-data
      - key: YIQI_ENABLE_CREATE
        value: "false"
