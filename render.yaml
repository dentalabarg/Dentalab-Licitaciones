services:
  - type: web
    name: dentalab-licitaciones-ia
    runtime: docker
    region: virginia
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: APP_ACCESS_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: YIQI_ENABLE_CREATE
        value: "false"
      - key: YIQI_USER
        sync: false
      - key: YIQI_PASSWORD
        sync: false
    disk:
      name: dentalab-data
      mountPath: /var/data
      sizeGB: 1
